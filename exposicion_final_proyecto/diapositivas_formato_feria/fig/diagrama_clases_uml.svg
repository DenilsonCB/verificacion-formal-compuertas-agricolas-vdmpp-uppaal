<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 470" width="100%" height="100%" style="background-color: white;">
  <defs>
    <style>
      .cls-title { font-family: 'Arial', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .cls-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 10.2px; fill: #000000; }
      .cls-rel { font-family: 'Arial', 'Segoe UI', sans-serif; font-size: 10px; fill: #334155; font-style: italic; }
      .cls-mult { font-family: 'Arial', 'Segoe UI', sans-serif; font-size: 10.5px; font-weight: bold; fill: #000000; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 3; }
      .line-div { stroke: #000000; stroke-width: 0.9; }
      .rel-line { stroke: #000000; stroke-width: 1.3; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 8" refX="0" refY="4" markerWidth="9" markerHeight="6" orient="auto">
      <polygon points="0,4 6,1 12,4 6,7" fill="#000000" stroke="#000000"/>
    </marker>
  </defs>

  <!-- CLASE CONTROLADOR (SUPERIOR) -->
  <g transform="translate(245, 10)">
    <rect class="box" width="360" height="192"/>
    <rect x="0" y="0" width="360" height="26" fill="#f8fafc" rx="3"/>
    <text x="180" y="18" class="cls-title">Controlador</text>
    <line x1="0" y1="26" x2="360" y2="26" class="line-div"/>
    <!-- Atributos -->
    <text x="10" y="42" class="cls-text">+ sensores : map token to Sensor</text>
    <text x="10" y="58" class="cls-text">+ compuertas : map token to Compuerta</text>
    <text x="10" y="74" class="cls-text">+ canales : map token to Canal</text>
    <text x="10" y="90" class="cls-text">+ alarmas_activas : set of token</text>
    <text x="10" y="106" class="cls-text">+ historial_telemetria : seq of LecturaSensor</text>
    <line x1="0" y1="114" x2="360" y2="114" class="line-div"/>
    <!-- Operaciones -->
    <text x="10" y="130" class="cls-text">+ RegistrarSensor(s: Sensor) : ()</text>
    <text x="10" y="146" class="cls-text">+ RegistrarCompuerta(c: Compuerta) : ()</text>
    <text x="10" y="162" class="cls-text">+ EvaluarRed() : ()</text>
    <text x="10" y="178" class="cls-text">+ SolicitarApertura(cid, p, vol) : bool</text>
  </g>

  <!-- CLASE SENSOR (INFERIOR IZQUIERDA) -->
  <g transform="translate(15, 290)">
    <rect class="box" width="255" height="165"/>
    <rect x="0" y="0" width="255" height="26" fill="#f8fafc" rx="3"/>
    <text x="127" y="18" class="cls-title">Sensor</text>
    <line x1="0" y1="26" x2="255" y2="26" class="line-div"/>
    <!-- Atributos -->
    <text x="10" y="45" class="cls-text">+ id : token</text>
    <text x="10" y="64" class="cls-text">+ caudal_actual : Caudal</text>
    <text x="10" y="81" class="cls-text">  LecturaSensor :: id, caudal, alerta</text>
    <line x1="0" y1="90" x2="255" y2="90" class="line-div"/>
    <!-- Operaciones -->
    <text x="10" y="108" class="cls-text">+ Sensor(s_id, val) : Sensor</text>
    <text x="10" y="126" class="cls-text">+ ActualizarCaudal(nuevo) : ()</text>
    <text x="10" y="144" class="cls-text">+ GenerarLectura() : LecturaSensor</text>
  </g>

  <!-- CLASE COMPUERTA (INFERIOR CENTRO) -->
  <g transform="translate(295, 290)">
    <rect class="box" width="260" height="165"/>
    <rect x="0" y="0" width="260" height="26" fill="#f8fafc" rx="3"/>
    <text x="130" y="18" class="cls-title">Compuerta</text>
    <line x1="0" y1="26" x2="260" y2="26" class="line-div"/>
    <!-- Atributos -->
    <text x="10" y="45" class="cls-text">+ id : token</text>
    <text x="10" y="64" class="cls-text">+ estado_actual : EstadoCompuerta</text>
    <text x="10" y="81" class="cls-text">+ porcentaje_apertura : Porcentaje</text>
    <line x1="0" y1="90" x2="260" y2="90" class="line-div"/>
    <!-- Operaciones -->
    <text x="10" y="108" class="cls-text">+ AbrirTotalmente() : ()</text>
    <text x="10" y="126" class="cls-text">+ CerrarTotalmente() : ()</text>
    <text x="10" y="144" class="cls-text">+ ConfigurarParcial(p) : ()</text>
  </g>

  <!-- CLASE CANAL (INFERIOR DERECHA) -->
  <g transform="translate(580, 290)">
    <rect class="box" width="255" height="165"/>
    <rect x="0" y="0" width="255" height="26" fill="#f8fafc" rx="3"/>
    <text x="127" y="18" class="cls-title">Canal</text>
    <line x1="0" y1="26" x2="255" y2="26" class="line-div"/>
    <!-- Atributos -->
    <text x="10" y="45" class="cls-text">+ id : token</text>
    <text x="10" y="64" class="cls-text">+ volumen_actual : Volumen</text>
    <text x="10" y="81" class="cls-text">+ capacidad_maxima : Volumen</text>
    <line x1="0" y1="90" x2="255" y2="90" class="line-div"/>
    <!-- Operaciones -->
    <text x="10" y="108" class="cls-text">+ InyectarAgua(vol) : ()</text>
    <text x="10" y="126" class="cls-text">+ DrenarAgua(vol) : ()</text>
    <text x="10" y="144" class="cls-text">+ AdmiteFlujo(flujo) : bool</text>
  </g>

  <!-- RELACIONES (COMPOSICIÓN / MAP) -->
  <!-- Controlador a Sensor -->
  <path d="M 310 202 L 310 242 L 142 242 L 142 288" class="rel-line" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <text x="316" y="216" class="cls-mult">1</text>
  <text x="148" y="282" class="cls-mult">1..*</text>
  <text x="150" y="236" class="cls-rel">sensores (map token to Sensor)</text>

  <!-- Controlador a Compuerta -->
  <path d="M 425 202 L 425 288" class="rel-line" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <text x="432" y="216" class="cls-mult">1</text>
  <text x="432" y="282" class="cls-mult">1..*</text>
  <text x="432" y="266" class="cls-rel">compuertas (map token to Compuerta)</text>

  <!-- Controlador a Canal -->
  <path d="M 540 202 L 540 242 L 707 242 L 707 288" class="rel-line" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <text x="524" y="216" class="cls-mult">1</text>
  <text x="714" y="282" class="cls-mult">1..*</text>
  <text x="548" y="236" class="cls-rel">canales (map token to Canal)</text>
</svg>
